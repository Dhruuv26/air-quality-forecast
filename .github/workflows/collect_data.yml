name: Collect air quality data

on:
  schedule:
    # every 6 hours; the air/weather step re-fetches the last 7 days and
    # de-duplicates, so a skipped or throttled run loses nothing
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit collected data back to the repo

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh air quality + weather (last 7 days, idempotent)
        env:
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: python src/ingestion/backfill_real.py --recent 7

      - name: Collect fire hotspots
        if: always()
        continue-on-error: true
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: python src/ingestion/firms_client.py

      - name: Commit new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv
          git diff --staged --quiet && echo "No new data to commit" || git commit -m "Scheduled data collection $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
